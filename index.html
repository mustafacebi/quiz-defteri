<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Defteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script>
    // Kayıtlı temayı sayfa çizilmeden uygula; yoksa bir an yanlış ışık görünür.
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="lamp" aria-hidden="true"></div>
  <header class="topbar">
    <a href="#/" class="logo">Quiz Defteri</a>
    <div class="top-tools">
      <span class="pens" id="pens" aria-label="Kalem rengi"></span>
      <button id="theme-toggle" class="desk-link" type="button"></button>
    </div>
  </header>
  <main id="app"></main>
  <!-- yazı sığdırma ölçümleri için görünmez kopya sayfa -->
  <div class="page" id="probe" aria-hidden="true"></div>

  <!-- Önbellek: her sürümde ?v= numarasını (css, js, veri) birlikte artır. -->
  <script src="data/questions.js?v=3"></script>
  <script src="js/vendor/page-flip.browser.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
